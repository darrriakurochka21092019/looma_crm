name: LOOMA checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: looma
          POSTGRES_PASSWORD: ci_database_only
          POSTGRES_DB: looma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U looma -d looma_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://looma:ci_database_only@127.0.0.1:5432/looma_test
      SEED_PASSWORD: CI-only-password-2026-strong
      APP_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: API and restore checks on PostgreSQL 17
        run: npm test
        env:
          TEST_RECOVERY: '1'
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_DUMP_BIN: ${{ github.workspace }}/scripts/ci-pg-dump.sh
          PG_RESTORE_BIN: ${{ github.workspace }}/scripts/ci-pg-restore.sh
      - run: npm audit --omit=dev --audit-level=high
      - name: Package application for local use without build tools
        run: node scripts/package-ready.mjs
      - name: Test ready package against PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U looma looma_runtime_test
          cd artifacts/LOOMA.CRM
          export DATABASE_URL=postgres://looma:ci_database_only@127.0.0.1:5432/looma_runtime_test
          node scripts/start-ready.mjs > /tmp/looma-ready.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat /tmp/looma-ready.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health
          node -e "const fs=require('node:fs'),assert=require('node:assert/strict'); for (const p of ['esbuild','tsx','vite','typescript']) assert.equal(fs.existsSync('node_modules/'+p), false, p);"
          node ../../scripts/ci-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: LOOMA-CRM-ready
          path: artifacts/LOOMA_CRM_READY.zip
  windows:
    name: Ready package dependencies on Windows
    runs-on: windows-2022
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installation failure stops the Windows launcher
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'looma-batch-check'
          New-Item -ItemType Directory -Path "$fixture/scripts" -Force | Out-Null
          Copy-Item start-local.bat "$fixture/start-local.bat"
          Copy-Item scripts/setup.mjs "$fixture/scripts/setup.mjs"
          @('@echo off', 'if "%1"=="ci" exit /b -1073741819', 'echo reached > db-was-started.txt', 'exit /b 0') | Set-Content "$fixture/npm.cmd"
          Push-Location $fixture
          cmd /d /c "start-local.bat <nul"
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { throw 'Launcher must report installation failure' }
          if (Test-Path db-was-started.txt) { throw 'Database initialization ran after failed installation' }
          Pop-Location
          $global:LASTEXITCODE = 0
      - uses: actions/download-artifact@v4
        with:
          name: LOOMA-CRM-ready
      - shell: pwsh
        run: |
          Expand-Archive LOOMA_CRM_READY.zip -DestinationPath ready
          Set-Location ready/LOOMA.CRM
          npm ci --omit=dev --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import argon2 from 'argon2'; import pg from 'pg'; import assert from 'node:assert/strict'; import { existsSync } from 'node:fs'; for (const p of ['esbuild','tsx','vite','typescript']) assert.equal(existsSync('node_modules/'+p), false, p); const h=await argon2.hash('CI-only-password'); assert.ok(await argon2.verify(h,'CI-only-password')); assert.ok(pg.Pool); console.log('Windows runtime dependencies verified without build tools.');"
  docker:
    name: Docker Compose launch
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare local configuration
        run: |
          node scripts/setup.mjs
          mkdir -p storage backups
          sudo chown -R 1000:1000 storage
      - name: Build and launch application
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Create owner and verify production application
        run: |
          docker compose exec -T app node dist/server/seed.js
          node --env-file=.env scripts/ci-smoke.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove temporary CI containers and database
        if: always()
        run: docker compose down -v
